# Publishes the Go runtime image pkg/runtime/runtime-image.json pins, to the
# fleet's canonical registry (ghcr.io -- infra-base docs/container-registry.md).
#
# The build is the SAME one ci.yml's "Verify runtime image digest is
# reproducible" runs -- no cache, SOURCE_DATE_EPOCH=0, the lock's platforms,
# no provenance or SBOM attestation, rewritten timestamps -- so the digest this
# publishes is the digest the lock already names. The last step proves it by
# pulling the lock's name@digest anonymously; a mismatch fails the publish
# rather than leaving a tag nobody pins.
name: Runtime image

on:
  push:
    tags:
      - 'runtime-v*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/codefly-dev/service-go-runtime
  LOCK: pkg/runtime/runtime-image.json
  CONTEXT: pkg/runtime/runtime-image

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
        with:
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The lock names this registry
        run: |
          set -euo pipefail
          name=$(jq -er '.name' "$LOCK")
          test "$name" = "$IMAGE" || { echo "$LOCK names $name, this workflow publishes $IMAGE" >&2; exit 1; }
      - name: Build reproducibly and publish
        run: |
          set -euo pipefail
          platforms=$(jq -er '.platforms | join(",")' "$LOCK")
          tag=$(jq -er '.tag' "$LOCK")
          docker buildx build --no-cache \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --platform "$platforms" \
            --provenance=false --sbom=false \
            --output "type=image,name=${IMAGE}:${tag},push=true,rewrite-timestamp=true" \
            --metadata-file /tmp/runtime-meta.json \
            "$CONTEXT"
          built=$(jq -er '."containerimage.digest"' /tmp/runtime-meta.json)
          expected=$(jq -er '.digest' "$LOCK")
          echo "published ${IMAGE}:${tag}@${built}"
          test "$built" = "$expected" || { echo "published digest $built is not the lock's $expected: re-lock before tagging" >&2; exit 1; }
      - name: Verify the lock's image is anonymously pullable
        run: |
          set -euo pipefail
          docker logout ghcr.io
          ref=$(jq -er '.name + "@" + .digest' "$LOCK")
          docker buildx imagetools inspect "$ref"
          docker run --rm "$ref" go version | grep -F 'go1.27.2'
